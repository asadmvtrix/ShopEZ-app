<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ShopEZ sells PC components, peripherals, displays and audio gear, with free delivery over $99."
    />
    <meta name="theme-color" content="#14304a" />
    <title>ShopEZ - Shop at your Ease!</title>
    <script>
      (function () {
        try {
          var key = "shopez.colorMode";
          var raw = localStorage.getItem(key);
          var saved = raw == null ? null : JSON.parse(raw);
          var mode;
          if (saved === "dark") {
            mode = "dark";
          } else if (saved === "system") {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          } else {
            mode = "light";
            if (saved !== "light") {
              localStorage.setItem(key, JSON.stringify("light"));
            }
          }
          var root = document.documentElement;
          if (mode === "dark") root.classList.add("dark");
          else root.classList.remove("dark");
          root.style.colorScheme = mode;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
